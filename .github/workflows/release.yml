name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        working-directory: app
        run: bun install

      - name: Resolve version
        id: version
        run: |
          VERSION=""
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          if [[ -z "$VERSION" ]]; then
            echo "::error::Version could not be resolved. Push a v* tag or provide a version via workflow_dispatch."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "v${{ steps.version.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "v${{ steps.version.outputs.version }}" \
              --repo "${{ github.repository }}" \
              --title "OpenJob v${{ steps.version.outputs.version }}" \
              --generate-notes
          fi

      - name: Build binaries and workspace bundle
        working-directory: app/packages/opencode
        env:
          OPENCODE_RELEASE: "1"
          OPENCODE_CHANNEL: "latest"
          OPENJOB_VERSION: ${{ steps.version.outputs.version }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bun run build --skip-embed-web-ui

      - name: Generate SHASUMS256.txt
        working-directory: app/packages/opencode/dist
        run: sha256sum *.tar.gz *.zip > SHASUMS256.txt

      - name: Upload SHASUMS256.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v${{ steps.version.outputs.version }}" \
            app/packages/opencode/dist/SHASUMS256.txt \
            --repo "${{ github.repository }}" \
            --clobber
